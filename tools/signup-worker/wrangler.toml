# Deploy:  cd tools/signup-worker && npx wrangler deploy      (free Cloudflare account; see README.md)
name = "videobeaux-signup"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://videobeaux.online"
GOOGLE_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLSf2hKP4D4rYgXS2ovwQJ8-YDHmqIfD2nsbC8tH_nO_oefuOCg/formResponse"
ENTRY_EMAIL = "entry.1552989964"
ENTRY_HEAR = "entry.1830674465"
ENTRY_INTEREST = "entry.94340946"

# alpha feedback form (feedback.html → POST /feedback). Fill these in from the feedback Google Form's page source; until
# FB_ACTION is set the Worker answers /feedback with "not set up yet".
FB_ACTION = ""            # https://docs.google.com/forms/d/e/FORM_ID/formResponse
FB_ENTRY_TYPE = ""        # entry.123456789 (the Bug / Feedback / Feature idea question)
FB_ENTRY_SUMMARY = ""     # the long-answer report question
FB_ENTRY_OS = ""          # the computer question
FB_ENTRY_EMAIL = ""       # the email question

# per-IP limit: 3 sign-ups per minute
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# secret (not in this file):  npx wrangler secret put TURNSTILE_SECRET
