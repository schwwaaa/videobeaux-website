# Deploy:  cd tools/signup-worker && npx wrangler deploy      (free Cloudflare account; see README.md)
name = "videobeaux-signup"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://videobeaux.online"
GOOGLE_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLSf2hKP4D4rYgXS2ovwQJ8-YDHmqIfD2nsbC8tH_nO_oefuOCg/formResponse"
ENTRY_EMAIL = "entry.1552989964"
ENTRY_HEAR = "entry.1830674465"
ENTRY_INTEREST = "entry.94340946"

# beta feedback form (feedback.html → POST /feedback). Fill these in from the feedback Google Form's page source; until
# FB_ACTION is set the Worker answers /feedback with "not set up yet".
FB_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLSctSUod0eb60G997B0xUEhsYS3sd1xwHSGbaRu0t0kxCQ0Kqw/formResponse"
FB_ENTRY_TYPE = "entry.1036933020"      # "This is a" (Bug / Feedback / Feature idea)
FB_ENTRY_SUMMARY = "entry.746783322"    # "Tell us what's going on" (must be a Paragraph question)
FB_ENTRY_OS = "entry.1686029902"        # "Your computer"
FB_ENTRY_EMAIL = "entry.1089460190"     # "Email"

# per-IP limit: 3 sign-ups per minute
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# secret (not in this file):  npx wrangler secret put TURNSTILE_SECRET
